name: Deploy to WordPress.org

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      SVN_USERNAME:
        required: true
      SVN_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (for example: v0.11.3)'
        required: true
        type: string

concurrency:
  group: release-wporg
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy plugin to WordPress.org
    if: github.repository == 'WordPress/reprint'
    runs-on: ubuntu-latest
    environment: svn
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check publishing user
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          UPSTREAM_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          # Check reruns of both this workflow and the Tag Release workflow.
          for ACTOR in "$TRIGGERING_ACTOR" "${UPSTREAM_TRIGGERING_ACTOR:-$TRIGGERING_ACTOR}"; do
            case "$ACTOR" in
              adamziel) ;;
              *)
                echo "::error::Account '$ACTOR' is not allowed to publish Reprint."
                exit 1
                ;;
            esac
          done

      - name: Resolve release tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must be a stable version such as v0.11.3."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          IS_DRAFT_OR_PRERELEASE="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')"
          if [ "$IS_DRAFT_OR_PRERELEASE" != false ]; then
            echo "::error::Release $RELEASE_TAG is a draft or prerelease; only stable releases can be deployed."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          persist-credentials: false
          submodules: true

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none
          ini-values: phar.readonly=0
          tools: composer:2.9.7

      - name: Install client dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build reprint.phar from tag
        run: ./bin/build-reprint-phar.sh

      - name: Verify release client
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          CLIENT_VERSION="$(php reprint.phar --version)"
          if [ "$CLIENT_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Client version '$CLIENT_VERSION' does not match release tag '$RELEASE_TAG'."
            exit 1
          fi

      - name: Stamp plugin version from git tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: ./bin/stamp-plugin-version.sh "$VERSION"

      # Release attachments can change without changing the tag. Build from
      # source so replacing an attachment cannot change the SVN package.
      - name: Build WordPress.org plugin from tag
        run: |
          ./bin/build-server-plugin.sh reprint-wordpress-org.zip wordpress-org
          unzip -q reprint-wordpress-org.zip

      - name: Verify release package
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: php tests/server-plugin-package.php reprint "$VERSION" wordpress-org

      - name: Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      # Publish the download before the plugin readme can link to it. Keep it
      # outside trunk and tags so WordPress installations do not receive it.
      - name: Publish client to SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          svn checkout --depth immediates https://plugins.svn.wordpress.org/reprint "$RUNNER_TEMP/reprint-client-svn"
          cd "$RUNNER_TEMP/reprint-client-svn"
          if [ -d downloads ]; then
            svn update --set-depth immediates downloads
          else
            mkdir downloads
            svn add downloads
          fi
          if [ -d "downloads/$VERSION" ]; then
            svn update --set-depth infinity "downloads/$VERSION"
          else
            mkdir "downloads/$VERSION"
            svn add "downloads/$VERSION"
          fi
          cp "$GITHUB_WORKSPACE/reprint.phar" "downloads/$VERSION/reprint.phar"
          svn add --force "downloads/$VERSION/reprint.phar"
          svn propset svn:mime-type application/octet-stream "downloads/$VERSION/reprint.phar"
          if [ -n "$(svn status downloads)" ]; then
            svn commit downloads -m "Publish Reprint client $VERSION" \
              --no-auth-cache --non-interactive --username "$SVN_USERNAME" --password "$SVN_PASSWORD"
          fi

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SLUG: reprint
          BUILD_DIR: reprint
