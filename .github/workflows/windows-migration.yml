name: Windows migration

on:
  push:
    branches: [trunk, codex/windows-to-linux-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-to-linux:
    name: Pull Windows WordPress into Linux
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mysqli, curl, mbstring, zip
          coverage: none
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: php-cli php-mysql php-curl php-mbstring php-xml php-zip composer mariadb-server
      - name: Prepare Linux client and database
        shell: wsl-bash {0}
        run: |
          mkdir -p /root/reprint
          tar --exclude=.git -cf - . | tar -xf - -C /root/reprint
          cd /root/reprint
          COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --prefer-dist
          service mariadb start
          mariadb -e "CREATE DATABASE migration_target; CREATE USER 'migration'@'127.0.0.1' IDENTIFIED BY 'migration'; GRANT ALL ON migration_target.* TO 'migration'@'127.0.0.1';"
      - name: Prepare native Windows WordPress source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Service MySQL
          composer install --working-dir=reprint-server-wp --no-dev --no-interaction --prefer-dist
          Invoke-WebRequest https://wordpress.org/wordpress-6.7.zip -OutFile "$env:RUNNER_TEMP/wordpress.zip"
          Expand-Archive "$env:RUNNER_TEMP/wordpress.zip" "$env:RUNNER_TEMP/wordpress"
          New-Item -ItemType Directory -Force D:\spacewww | Out-Null
          Move-Item "$env:RUNNER_TEMP/wordpress/wordpress" D:\spacewww\nihaokids.nl
          Copy-Item -Recurse reprint-server-wp D:\spacewww\nihaokids.nl\wp-content\plugins\reprint-server
          $windowsHost = (wsl -d Ubuntu-24.04 -- bash -c "ip route show default | cut -d ' ' -f 3").Trim()
          php tests/e2e/windows/prepare-source.php D:\spacewww\nihaokids.nl "http://${windowsHost}:8081" "$env:RUNNER_TEMP/source-manifest.json"
          New-NetFirewallRule -DisplayName ReprintMigration -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8081 | Out-Null
          Start-Process php -ArgumentList '-S', '0.0.0.0:8081', '-t', 'D:\spacewww\nihaokids.nl' -RedirectStandardOutput "$env:RUNNER_TEMP/source.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/source.stderr.log"
      - name: Migrate and verify the site on Linux
        shell: wsl-bash {0}
        run: |
          windows_host=$(ip route show default | cut -d ' ' -f 3)
          runner_temp=$(wslpath "${RUNNER_TEMP}")
          cd /root/reprint
          bash tests/e2e/windows/migrate.sh "http://${windows_host}:8081" "$runner_temp/source-manifest.json"
      - name: Collect migration logs
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/source.stderr.log" -ErrorAction SilentlyContinue
          wsl -d Ubuntu-24.04 -- bash -c 'find /root/migration -name "*.log" -exec tail -100 {} \;'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-migration-logs
          path: ${{ runner.temp }}/source.*.log
