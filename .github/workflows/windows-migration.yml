name: Windows migration

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-reader:
    name: Read Windows paths without FFI
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, :ffi
          ini-values: ffi.enable=false
          coverage: none
      - name: Install server autoloader
        run: composer install --working-dir=packages/reprint-server --no-dev --no-interaction --prefer-dist
      - name: Check PHP source reads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/e2e/windows/prepare-path-namespaces.ps1 "$env:GITHUB_WORKSPACE/namespace-cases.json"
          php tests/e2e/windows/verify-source-reader.php
  received-paths:
    name: Reject dot segments in received paths
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Check received entry paths on a native Windows client
        working-directory: tests
        run: php ../vendor/bin/phpunit --group received-paths Import/RuntimeFilesRootPathTest.php
  windows-client:
    name: Pull, merge, and flatten with a native Windows client (${{ matrix.account }})
    strategy:
      fail-fast: false
      matrix:
        # A standard account cannot create symlinks; the client uses junctions and hard links.
        account: [administrator, standard]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, curl, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Run link-placing client tests
        shell: pwsh
        run: |
          $tests = 'PathFormatTest.php,Import/RemapSeamTest.php,Import/LocalLinkTest.php,Import/PullLinkBeforeTargetTest.php,Import/FilesPullLocalIndexTest.php,Import/PullFilterOptionTest.php,Import/MergeWpContentTest.php,Import/FlatDocrootWpConfigTest.php,Import/FlatDocrootCoreFilesCopyTest.php,--group windows-links Import/ProductionDropInRemovalTest.php'
          $php = (Get-Command php).Source
          $failed = 0
          foreach ($test in $tests.Split(',')) {
            Write-Output "::group::$test"
            if ('${{ matrix.account }}' -eq 'standard') {
              ./tests/e2e/windows/run-as-standard-user.ps1 -WorkingDirectory "$env:GITHUB_WORKSPACE\tests" -Command "`"$php`" ..\vendor\bin\phpunit $test"
            } else {
              Push-Location tests
              & $php ../vendor/bin/phpunit --display-warnings $test.Split(' ')
              Pop-Location
            }
            if ($LASTEXITCODE -ne 0) { $failed++ }
            Write-Output '::endgroup::'
          }
          exit $failed
  linux-to-windows:
    name: Pull linked Linux WordPress into a native Windows client (${{ matrix.account }})
    strategy:
      fail-fast: false
      matrix:
        account: [administrator, standard]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, curl, mbstring, zip, openssl
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: php-cli php-mysql php-curl php-mbstring php-xml php-zip composer mariadb-server curl
      - name: Prepare the linked Linux source
        shell: wsl-bash {0}
        run: |
          mkdir -p /root/reprint
          tar --exclude=.git --exclude=vendor -cf - . | tar -xf - -C /root/reprint
          bash /root/reprint/tests/e2e/windows/prepare-linux-source.sh /root/reprint /root/source-key.pem
      # Keep the Linux server process alive until the Windows pull has finished.
      - name: Pull with the native Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $keyPath = "$env:RUNNER_TEMP\source-key.pem"
          wsl -d Ubuntu-24.04 --exec cp /root/source-key.pem (wsl -d Ubuntu-24.04 --exec wslpath -a "$env:RUNNER_TEMP/source-key.pem").Trim()
          Start-Process wsl -ArgumentList '-d', 'Ubuntu-24.04', '--exec', 'php', '-S', '0.0.0.0:8082', '-t', '/srv/htdocs' -RedirectStandardOutput "$env:RUNNER_TEMP/source.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/source.stderr.log"
          $sourceAddress = (wsl -d Ubuntu-24.04 --exec hostname -I).Trim().Split(' ')[0]
          $sourceUrl = "http://${sourceAddress}:8082"
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try { Invoke-WebRequest "$sourceUrl/wp-content/uploads/2026/01/hello.txt" -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          if ('${{ matrix.account }}' -eq 'standard') {
            # The standard account owns only its sandbox, so the key and work directory live there.
            $workDirectory = 'C:\reprint-standard-user\client'
            New-Item -ItemType Directory -Force $workDirectory | Out-Null
            Copy-Item $keyPath "$workDirectory\..\source-key.pem"
            $php = (Get-Command php).Source
            ./tests/e2e/windows/run-as-standard-user.ps1 -WorkingDirectory $env:GITHUB_WORKSPACE -Command "`"$php`" tests\e2e\windows\pull-into-windows.php `"$sourceUrl/?reprint-api`" C:\reprint-standard-user\source-key.pem $workDirectory"
          } else {
            New-Item -ItemType Directory -Force C:\reprint-client | Out-Null
            php tests/e2e/windows/pull-into-windows.php "$sourceUrl/?reprint-api" $keyPath C:\reprint-client
          }
      - name: Collect client logs
        if: always()
        shell: pwsh
        run: |
          foreach ($workDirectory in 'C:\reprint-client', 'C:\reprint-standard-user\client') {
            Get-ChildItem "$workDirectory\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::group::$($_.Name)"; Get-Content $_ -Tail 80; Write-Output '::endgroup::' }
            Get-Content "$workDirectory\state\audit.log" -Tail 120 -ErrorAction SilentlyContinue
          }
          Get-Content "$env:RUNNER_TEMP/source.stderr.log" -Tail 40 -ErrorAction SilentlyContinue
  windows-to-linux:
    needs: php-reader
    name: Pull Windows WordPress into Linux (${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        source: [drive, share]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mysqli, curl, mbstring, zip, :ffi
          ini-values: ffi.enable=false
          coverage: none
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: php-cli php-mysql php-curl php-mbstring php-xml php-zip composer mariadb-server
      - name: Prepare Linux client and database
        shell: wsl-bash {0}
        run: |
          mkdir -p /root/reprint
          tar --exclude=.git -cf - . | tar -xf - -C /root/reprint
          cd /root/reprint
          COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --prefer-dist
          service mariadb start
          mariadb -e "CREATE DATABASE migration_target; CREATE USER 'migration'@'127.0.0.1' IDENTIFIED BY 'migration'; GRANT ALL ON migration_target.* TO 'migration'@'127.0.0.1';"
      # Keep the native server processes alive until the Linux pull has finished.
      - name: Run Windows-to-Linux migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          mysqld --initialize-insecure --datadir="$env:RUNNER_TEMP/mysql-data"
          Start-Process mysqld -ArgumentList "--datadir=$env:RUNNER_TEMP/mysql-data", '--bind-address=127.0.0.1', '--port=3308', '--console' -RedirectStandardOutput "$env:RUNNER_TEMP/source.mysql.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/source.mysql.stderr.log"
          mysqladmin --host=127.0.0.1 --port=3308 --user=root --wait=30 ping
          mysql --host=127.0.0.1 --port=3308 --user=root --execute="ALTER USER 'root'@'localhost' IDENTIFIED BY 'root'"
          composer install --working-dir=reprint-server-wp --no-dev --no-interaction --prefer-dist
          Invoke-WebRequest https://wordpress.org/wordpress-6.7.zip -OutFile "$env:RUNNER_TEMP/wordpress.zip"
          Expand-Archive "$env:RUNNER_TEMP/wordpress.zip" "$env:RUNNER_TEMP/wordpress"
          $siteDirectory = 'D:\Migration Sites\Example café'
          New-Item -ItemType Directory -Force (Split-Path $siteDirectory) | Out-Null
          Move-Item -LiteralPath "$env:RUNNER_TEMP/wordpress/wordpress" -Destination $siteDirectory
          Copy-Item -Recurse reprint-server-wp "$siteDirectory/wp-content/plugins/reprint-server"
          if ('${{ matrix.source }}' -eq 'share') {
            $siteDirectory = '\\localhost\D$' + $siteDirectory.Substring(2)
          }
          $windowsHost = (wsl -d Ubuntu-24.04 --exec bash -c "ip route show default | cut -d ' ' -f 3").Trim()
          ./tests/e2e/windows/prepare-path-namespaces.ps1 "$env:GITHUB_WORKSPACE/namespace-cases.json"
          php tests/e2e/windows/prepare-source.php "$siteDirectory" "http://${windowsHost}:8081" "$env:GITHUB_WORKSPACE/source-manifest.json"
          New-NetFirewallRule -DisplayName ReprintMigration -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8081 | Out-Null
          Start-Process php -ArgumentList '-S', '0.0.0.0:8081', '-t', ('"' + $siteDirectory + '"') -RedirectStandardOutput "$env:RUNNER_TEMP/source.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/source.stderr.log"
          $sourceManifest = (wsl -d Ubuntu-24.04 --exec wslpath -a "$env:GITHUB_WORKSPACE/source-manifest.json").Trim()
          wsl -d Ubuntu-24.04 --exec bash -c "cd /root/reprint && bash tests/e2e/windows/migrate.sh 'http://${windowsHost}:8081' '$sourceManifest'"
      - name: Collect migration logs
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/source.stderr.log" -ErrorAction SilentlyContinue
          wsl -d Ubuntu-24.04 --exec bash -c 'if [ -d /root/migration ]; then mkdir -p migration-logs; find /root/migration -name "*.log" -exec cp {} migration-logs/ \; -exec tail -100 {} \;; fi'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-migration-logs-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/source.*.log
            migration-logs/

  ci-result:
    name: Windows migration result
    needs: [php-reader, received-paths, windows-client, linux-to-windows, windows-to-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS"
          jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
