name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Tag Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example: v0.1.43)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build release artifacts
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Resolve release tag
        id: release_ref
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" --list 'v*' --sort=-v:refname | head -1)"
            if [ -z "${TAG}" ]; then
              echo "::error::No v* tag found for workflow head SHA ${{ github.event.workflow_run.head_sha }}"
              exit 1
            fi
          fi

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not exist"
            exit 1
          fi

          git checkout "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, json, hash, zlib, mbstring
          ini-values: phar.readonly=0
          tools: composer:2.9.7

      - run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build reprint.phar
        run: ./bin/build-reprint-phar.sh

      - name: Install Reprint Server plugin build dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --working-dir=tools/php56-build

      - name: Stamp plugin version from git tag
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: ./bin/stamp-plugin-version.sh "${RELEASE_TAG#v}"

      # The ZIP filename is a distribution contract: released client binaries
      # hardcode it in their download URL, and because the archive contents sit
      # at its root, WordPress derives the installed plugin directory from the
      # filename. Renaming it would install a second plugin beside the existing
      # reprint-exporter-wp/ instead of upgrading it. The source directory is
      # reprint-server-wp/; only the artifact keeps the legacy name.
      - name: Build reprint-exporter-wp.zip
        run: ./bin/build-server-plugin.sh

      - name: Build downloads-only WordPress.org plugin
        run: ./bin/build-server-plugin.sh reprint-wordpress-org.zip wordpress-org

      - name: Check the packaged plugin before publishing
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          artifact_dir="$RUNNER_TEMP/reprint-exporter-wp"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          unzip -q reprint-exporter-wp.zip -d "$artifact_dir"
          php tests/server-plugin-package.php "$artifact_dir" "${RELEASE_TAG#v}"
          unzip -q reprint-wordpress-org.zip -d "$RUNNER_TEMP/wordpress-org"
          php tests/server-plugin-package.php "$RUNNER_TEMP/wordpress-org/reprint" "${RELEASE_TAG#v}" wordpress-org

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            reprint.phar
            reprint-exporter-wp.zip
            reprint-wordpress-org.zip

  publish:
    name: Publish release files
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release-files/reprint.phar
            release-files/reprint-exporter-wp.zip
            release-files/reprint-wordpress-org.zip
          generate_release_notes: true

  deploy-wporg:
    name: Deploy to WordPress.org
    needs: [release, publish]
    if: github.repository == 'WordPress/reprint'
    uses: ./.github/workflows/release-wporg.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
