name: Update build inputs

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  # GitHub replaces older pending runs in the same group. Keep each PR's
  # tests separate while publishing runs still share one group.
  group: update-build-inputs-${{ github.event.pull_request.number || 'updates' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/e2e/ci/update-build-inputs.test.mjs

  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: trunk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check upstream releases
        run: node bin/update-build-inputs.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open or update the dependency PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          # A fixed branch refreshes the same open PR instead of adding another
          # each week while an earlier update is waiting for review.
          branch: codex/update-build-inputs
          commit-message: '[CI] Update Box and WP-CLI releases and checksums'
          title: '[CI] Update Box and WP-CLI releases and checksums'
          body: |
            Updates Box and WP-CLI to their latest stable releases and records the SHA-256 of each downloaded PHAR.

            Later updater runs refresh this PR until it is merged or closed. Approve any waiting CI runs, then review and merge the update manually.
          add-paths: |
            bin/build-reprint-phar.sh
            tests/e2e/ci/download-wp-cli.sh

  ci-result:
    name: Build input updater result
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS"
          jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
