name: Tag Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only when bump is "custom", e.g. 0.1.6). The "v" prefix is added automatically.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: trunk

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version
        id: version
        run: |
          if [ "${{ inputs.bump }}" = "custom" ]; then
            if [ -z "${{ inputs.custom_version }}" ]; then
              echo "::error::Custom version is required when bump type is 'custom'"
              exit 1
            fi
            VERSION="${{ inputs.custom_version }}"
          else
            # Find the latest vX.Y.Z tag
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              echo "::error::No existing version tags found. Use 'custom' to set the first version."
              exit 1
            fi

            # Strip the "v" prefix and split into components
            LATEST="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

            case "${{ inputs.bump }}" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Validate version format
        run: |
          if ! echo "${{ steps.version.outputs.value }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in semver format (e.g. 0.1.6)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.value }} already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"
          echo "Tagged and pushed v${{ steps.version.outputs.value }}"

      # The tag above is the release. This step only stamps the next -dev version
      # on trunk, so continue-on-error keeps a stamping failure from failing the
      # workflow: the Release and Publish workflows trigger on this one concluding
      # success, and a red run here skips both of them.
      #
      # Trunk rejects direct pushes, so the stamp lands as a pull request.
      # Verify the exact version-only diff before using the repository token's
      # admin bypass. Full-suite failures must not hold up a mechanical stamp.
      # The tag push above keeps GITHUB_TOKEN so Release and Publish run only
      # through workflow_run.
      - name: Bump trunk to next dev version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.value }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-dev"
          BRANCH="release/bump-$NEXT_DEV"

          git checkout trunk
          git checkout -b "$BRANCH"
          ./bin/stamp-plugin-version.sh "$NEXT_DEV"

          git add reprint-server-wp/index.php reprint-server-wp/lib.php reprint-server-wp/readme.txt
          git commit -m "Bump plugin version to $NEXT_DEV after v$VERSION release"

          python3 - "$NEXT_DEV" <<'PY'
          import re
          import subprocess
          import sys

          version_fields = {
              'reprint-server-wp/index.php': [(b' * Version: ', b'\n')],
              'reprint-server-wp/lib.php': [(br"define(__NAMESPACE__ . '\\VERSION', '", b"');")],
              'reprint-server-wp/readme.txt': [
                  (b'Stable tag: ', b'\n'),
                  (b'https://plugins.svn.wordpress.org/reprint/downloads/', b'/reprint.phar'),
              ],
          }
          changed_paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD']).decode().splitlines()
          if sorted(changed_paths) != sorted(version_fields):
              sys.exit(f'Version bump must change only the three version files; observed {changed_paths}.')
          summary = subprocess.check_output(['git', 'diff', '--summary', 'HEAD^', 'HEAD']).decode().strip()
          if summary:
              sys.exit(f'Version bump must not change file types or permissions; observed {summary}.')
          readme = subprocess.check_output(['git', 'show', 'HEAD^:reprint-server-wp/readme.txt'])
          stable_tag = re.search(rb'^Stable tag: ([^\r\n]+)', readme, re.M)
          if stable_tag is None:
              sys.exit('Version bump cannot be verified because the previous readme has no Stable tag.')
          old_version = stable_tag.group(1)
          new_version = sys.argv[1].encode()
          for path, replacements in version_fields.items():
              expected = subprocess.check_output(['git', 'show', f'HEAD^:{path}'])
              for prefix, suffix in replacements:
                  expected = expected.replace(prefix + old_version + suffix, prefix + new_version + suffix)
              after = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              if after != expected:
                  sys.exit(f'Version bump changes more than the expected version strings in {path}.')
          print(f'Verified version-only bump to {sys.argv[1]}.')
          PY

          git push origin "$BRANCH"

          gh pr create \
            --base trunk \
            --head "$BRANCH" \
            --title "Bump plugin version to $NEXT_DEV after v$VERSION release" \
            --body "Stamps the next development version into reprint-server-wp/ after the v$VERSION tag. Opened by the Tag Release workflow."

          gh pr merge --squash --admin --delete-branch --match-head-commit "$(git rev-parse HEAD)" "$BRANCH"
