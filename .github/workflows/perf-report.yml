name: Performance Report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Two PHAR builds can install GitHub-hosted archives at the same time. Keep each
# Composer process serial so the workflow does not create a burst of requests.
env:
  COMPOSER_MAX_PARALLEL_HTTP: '1'

jobs:
  build-pr-phar:
    name: Build reprint.phar (PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, json, hash, zlib, mbstring

      - name: Install production dependencies
        run: |
          for attempt in 1 2 3; do
            if composer install --no-dev --no-interaction --prefer-dist; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            wait_seconds=$((attempt * 20))
            echo "Composer install attempt ${attempt}/3 failed; retrying in ${wait_seconds} seconds."
            sleep "$wait_seconds"
          done
      - run: ./bin/build-reprint-phar.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-phar-pr
          path: reprint.phar

  build-trunk-phar:
    name: Build reprint.phar (trunk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: trunk
          submodules: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, json, hash, zlib, mbstring

      - name: Install production dependencies
        run: |
          for attempt in 1 2 3; do
            if composer install --no-dev --no-interaction --prefer-dist; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            wait_seconds=$((attempt * 20))
            echo "Composer install attempt ${attempt}/3 failed; retrying in ${wait_seconds} seconds."
            sleep "$wait_seconds"
          done
      - run: ./bin/build-reprint-phar.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-phar-trunk
          path: reprint.phar

  bench:
    name: Pull pipeline benchmark
    needs: [build-pr-phar, build-trunk-phar]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PHP_VERSION: '8.5'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Resolve focused bench stages
        id: stages
        run: |
          file="tests/e2e/benchmark/focused-stages.txt"
          if [ -f "$file" ]; then
            stages="$(grep -v '^[[:space:]]*$' "$file" | grep -v '^[[:space:]]*#' | paste -sd, -)"
          else
            stages=""
          fi
          echo "stages=$stages" >> "$GITHUB_OUTPUT"
          echo "Focused stages: $stages"

      - name: Download PR phar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-phar-pr
          path: phars/pr

      - name: Download trunk phar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-phar-trunk
          path: phars/trunk

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Test benchmark reporting
        run: node --test tests/e2e/benchmark/*.test.mjs

      # PHP comes from the runner's pre-cached toolcache via this
      # action; we don't try to apt-install ondrej/php ourselves
      # because every Launchpad endpoint flakes regularly.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, json, hash, zlib, mbstring, curl, xml, sqlite3
          coverage: none

      - name: Setup infrastructure
        run: tests/e2e/ci/setup-infrastructure.sh "${{ env.PHP_VERSION }}"

      - name: Setup test sites
        run: tests/e2e/setup.sh

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Download wp-cli
        run: tests/e2e/ci/download-wp-cli.sh

      - name: Bench PR
        working-directory: tests/e2e
        env:
          IMPORTER_PATH: ${{ github.workspace }}/phars/pr/reprint.phar
          BENCH_LABEL: pr
          BENCH_JSON_OUT: bench-pr.json
          BENCH_MD_OUT: bench-pr.md
          BENCH_STAGES: ${{ steps.stages.outputs.stages }}
          E2E_SERVER_PROJECT_ROOT: ${{ github.workspace }}
          # Keep the PHP.wasm SQLite benchmark large enough to exercise the
          # parser without pushing a PR check into the workflow timeout.
          BENCH_SEED_POSTS: '10000'
          BENCH_SEED_POSTMETA: '25000'
          BENCH_PLAYGROUND_PHP_BINARY: ${{ github.workspace }}/tests/e2e/ci/playground-php.sh
          PLAYGROUND_PHP_USE_WASM_RUNNER: '1'
          PLAYGROUND_PHP_VERSION: '8.3'
          WP_MYSQL_PARSER_EXTENSION: '1'
        run: node benchmark/bench-pull.mjs

      - name: Reset benchmark sites before trunk
        run: |
          sudo rm -rf /srv/e2e-sites/large-directory /srv/e2e-sites/large-single-file
          sudo rm -f /tmp/e2e-site-large-directory.lock /tmp/e2e-site-large-single-file.lock

      - name: Bench trunk
        working-directory: tests/e2e
        env:
          IMPORTER_PATH: ${{ github.workspace }}/phars/trunk/reprint.phar
          BENCH_LABEL: trunk
          BENCH_JSON_OUT: bench-trunk.json
          BENCH_MD_OUT: bench-trunk.md
          BENCH_STAGES: ${{ steps.stages.outputs.stages }}
          E2E_SERVER_PROJECT_ROOT: ${{ github.workspace }}
          BENCH_SEED_POSTS: '10000'
          BENCH_SEED_POSTMETA: '25000'
          BENCH_PREFLIGHT_IMPORTER_PATH: ${{ github.workspace }}/phars/pr/reprint.phar
          BENCH_PLAYGROUND_PHP_BINARY: ${{ github.workspace }}/tests/e2e/ci/playground-php.sh
          PLAYGROUND_PHP_USE_WASM_RUNNER: '1'
          PLAYGROUND_PHP_VERSION: '8.3'
          # Match the PR side. Without this, the Playground SQLite db-pull
          # / db-apply scenarios run on trunk WITHOUT the Rust MySQL parser
          # extension (because the parser is loaded only when the manifest
          # URL is set), while the PR side runs WITH it. The resulting
          # comparison shows a constant ~10× "improvement" attributable to
          # the parser, on every PR — which has nothing to do with what
          # the PR actually changes. Keep both sides on the same parser.
          WP_MYSQL_PARSER_EXTENSION: '1'
        # Don't fail the whole job if trunk's bench fails — we still want
        # to publish the PR's numbers.
        continue-on-error: true
        run: node benchmark/bench-pull.mjs

      - name: Render PR vs. trunk diff
        working-directory: tests/e2e
        env:
          BASELINE_LABEL: trunk
        run: node benchmark/render-diff.mjs

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pull-pipeline-bench
          path: |
            tests/e2e/bench-pr.json
            tests/e2e/bench-trunk.json
            tests/e2e/bench-results.md
          if-no-files-found: ignore

      - name: Check bench-results.md exists
        id: check_md
        if: always()
        run: |
          if [ -f tests/e2e/bench-results.md ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post sticky PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.check_md.outputs.exists == 'true'
        # The step summary and artifact already contain the benchmark result.
        # A GitHub comment outage must not replace that result with a red check.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pull-pipeline-perf
          path: tests/e2e/bench-results.md

  # Native Windows PHP pulls from a source in WSL on the same runner. The
  # Linux client then pulls the same source there, for the platform table.
  bench-windows:
    name: Pull pipeline benchmark (Windows client)
    needs: [build-pr-phar, build-trunk-phar]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mysqli, pdo_mysql, pdo_sqlite, sqlite3, curl, mbstring, zip, openssl
          coverage: none

      - name: Download PR phar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-phar-pr
          path: phars/pr

      - name: Download trunk phar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-phar-trunk
          path: phars/trunk

      - name: Record the Windows PHP path
        shell: pwsh
        run: (Get-Command php).Source | Out-File -Encoding ascii -NoNewline windows-php-path.txt

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: php8.3-cli php8.3-fpm php8.3-mysql php8.3-curl php8.3-mbstring php8.3-xml php8.3-zip php8.3-sqlite3 composer jq curl xz-utils

      # setup-infrastructure.sh starts its services with systemctl.
      - name: Enable systemd in WSL
        shell: wsl-bash {0}
        run: printf '[boot]\nsystemd=true\n' > /etc/wsl.conf

      - name: Restart WSL with systemd
        shell: pwsh
        run: wsl --terminate Ubuntu-24.04

      - name: Copy the harness into WSL and install Node
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          mkdir -p /root/reprint
          tar --exclude=.git --exclude=vendor -cf - . | tar -xf - -C /root/reprint
          node_tarball=$(curl -fsSL https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt | awk '/linux-x64.tar.xz/ { print $2 }')
          curl -fsSL "https://nodejs.org/dist/latest-v24.x/$node_tarball" | tar -xJ -C /opt
          ln -sf /opt/"${node_tarball%.tar.xz}"/bin/* /usr/local/bin/

      - name: Setup the source in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd /root/reprint
          tests/e2e/ci/setup-infrastructure.sh 8.3
          tests/e2e/setup.sh
          tests/e2e/ci/download-wp-cli.sh
          (cd tests/e2e && npm ci)
          # WSL steps do not inherit the job environment, so each bench sources these.
          cat > /root/bench-settings.sh <<'SETTINGS'
          export BENCH_STAGES=preflight,files-pull,db-pull,db-apply,apply-runtime
          export BENCH_URL_REWRITE=0
          export BENCH_SEED_POSTS=10000 BENCH_SEED_POSTMETA=25000
          export E2E_SERVER_PROJECT_ROOT=/root/reprint
          SETTINGS

      - name: Bench PR with the Windows client
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          source /root/bench-settings.sh
          workspace=$(pwd)
          export WINDOWS_PHP=$(wslpath -u "$(cat windows-php-path.txt)")
          export PHP_BINARY=/root/reprint/tests/e2e/ci/windows-php.sh
          export IMPORTER_PATH="$workspace/phars/pr/reprint.phar"
          # State and the pulled tree live on NTFS, as they do for a Windows user.
          mkdir -p /mnt/c/reprint-bench-tmp
          export TMPDIR=/mnt/c/reprint-bench-tmp
          export BENCH_LABEL=pr BENCH_JSON_OUT=bench-windows-pr.json BENCH_MD_OUT=bench-windows-pr.md
          cd /root/reprint/tests/e2e
          trap 'cp bench-windows-pr.json "$workspace/" 2>/dev/null || true' EXIT
          node benchmark/bench-pull.mjs

      - name: Reset benchmark sites before trunk
        shell: wsl-bash {0}
        run: rm -rf /srv/e2e-sites/large-directory /tmp/e2e-site-large-directory.lock

      # Trunk could not pull on Windows before the native Windows client landed.
      - name: Bench trunk with the Windows client
        shell: wsl-bash {0}
        continue-on-error: true
        run: |
          set -euo pipefail
          source /root/bench-settings.sh
          workspace=$(pwd)
          export WINDOWS_PHP=$(wslpath -u "$(cat windows-php-path.txt)")
          export PHP_BINARY=/root/reprint/tests/e2e/ci/windows-php.sh
          export IMPORTER_PATH="$workspace/phars/trunk/reprint.phar"
          export BENCH_PREFLIGHT_IMPORTER_PATH="$workspace/phars/pr/reprint.phar"
          export TMPDIR=/mnt/c/reprint-bench-tmp
          export BENCH_LABEL=trunk BENCH_JSON_OUT=bench-windows-trunk.json BENCH_MD_OUT=bench-windows-trunk.md
          cd /root/reprint/tests/e2e
          trap 'cp bench-windows-trunk.json "$workspace/" 2>/dev/null || true' EXIT
          node benchmark/bench-pull.mjs

      - name: Bench PR with the Linux client on the same runner
        shell: wsl-bash {0}
        continue-on-error: true
        run: |
          set -euo pipefail
          source /root/bench-settings.sh
          workspace=$(pwd)
          mkdir -p /root/phars
          cp "$workspace/phars/pr/reprint.phar" /root/phars/pr.phar
          export IMPORTER_PATH=/root/phars/pr.phar
          # The source enrolled the key the Windows runs generated under their TMPDIR.
          cp -r /mnt/c/reprint-bench-tmp/reprint-e2e-keys /tmp/
          export BENCH_LABEL=wsl-linux BENCH_JSON_OUT=bench-wsl-linux-pr.json BENCH_MD_OUT=bench-wsl-linux-pr.md
          cd /root/reprint/tests/e2e
          trap 'cp bench-wsl-linux-pr.json "$workspace/" 2>/dev/null || true' EXIT
          node benchmark/bench-pull.mjs

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pull-pipeline-bench-windows
          path: |
            bench-windows-pr.json
            bench-windows-trunk.json
            bench-wsl-linux-pr.json
          if-no-files-found: ignore

  # The Linux job posts its report as soon as it finishes; this replaces it
  # with both reports once the Windows job has finished too.
  report:
    name: Combine the Linux and Windows reports
    needs: [bench, bench-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Download Linux report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pull-pipeline-bench
          path: tests/e2e/linux

      - name: Download Windows results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pull-pipeline-bench-windows
          path: tests/e2e/windows

      - name: Render the combined report
        id: render
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          sections=()
          [ -f linux/bench-results.md ] && sections+=(linux/bench-results.md)
          if [ -f windows/bench-windows-pr.json ]; then
            PR_JSON=windows/bench-windows-pr.json TRUNK_JSON=windows/bench-windows-trunk.json \
              OUT_MD=windows/bench-windows.md BASELINE_LABEL=trunk \
              REPORT_HEADING='Native Windows client' PERF_HISTORY_URL=none \
              node benchmark/render-diff.mjs > /dev/null
            sections+=(windows/bench-windows.md)
            if [ -f windows/bench-wsl-linux-pr.json ]; then
              WINDOWS_JSON=windows/bench-windows-pr.json LINUX_JSON=windows/bench-wsl-linux-pr.json \
                OUT_MD=windows/bench-platforms.md node benchmark/render-platforms.mjs > /dev/null
              sections+=(windows/bench-platforms.md)
            fi
          fi
          if [ ${#sections[@]} -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for section in "${sections[@]}"; do cat "$section"; echo; done > bench-combined.md
          cat bench-combined.md >> "$GITHUB_STEP_SUMMARY"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.render.outputs.exists == 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pull-pipeline-perf
          path: tests/e2e/bench-combined.md

  ci-result:
    name: Performance result
    needs: [build-pr-phar, build-trunk-phar, bench, bench-windows, report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS"
          jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
