name: Performance History

# After each commit lands on trunk, run the pull-pipeline benchmark and
# publish a new data point to GitHub Pages (gh-pages branch).
#
# The page itself lives in `.github/perf-site/` on trunk and is copied to gh-pages
# on each run, so edits to the visualization happen via normal PRs.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-history
  cancel-in-progress: false

jobs:
  build-phar:
    name: Build reprint.phar (trunk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, json, hash, zlib, mbstring

      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: ./bin/build-reprint-phar.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-phar-trunk
          path: reprint.phar

  bench-and-publish:
    name: Bench trunk
    needs: build-phar
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PHP_VERSION: '8.5'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: true

      - name: Download trunk phar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-phar-trunk
          path: phars/trunk

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # PHP comes from the runner's pre-cached toolcache via this
      # action; we don't try to apt-install ondrej/php ourselves
      # because every Launchpad endpoint flakes regularly.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, json, hash, zlib, mbstring, curl, xml, sqlite3
          coverage: none

      - name: Setup infrastructure
        run: tests/e2e/ci/setup-infrastructure.sh "${{ env.PHP_VERSION }}"

      - name: Setup test sites
        run: tests/e2e/setup.sh

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Download wp-cli
        run: tests/e2e/ci/download-wp-cli.sh

      - name: Bench trunk
        working-directory: tests/e2e
        env:
          IMPORTER_PATH: ${{ github.workspace }}/phars/trunk/reprint.phar
          BENCH_LABEL: trunk
          BENCH_JSON_OUT: bench-trunk.json
          BENCH_MD_OUT: bench-trunk.md
          BENCH_PLAYGROUND_PHP_BINARY: ${{ github.workspace }}/tests/e2e/ci/playground-php.sh
          PLAYGROUND_PHP_USE_WASM_RUNNER: '1'
          PLAYGROUND_PHP_VERSION: '8.3'
          WP_MYSQL_PARSER_EXTENSION: '1'
        run: node benchmark/bench-pull.mjs

      - name: Capture commit metadata
        id: commit
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          {
            echo 'message<<EOF'
            git log -1 --pretty=%s
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git reset --hard && find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +)
          fi

      - name: Update site files and append history entry
        env:
          BENCH_JSON: tests/e2e/bench-trunk.json
          HISTORY_JSON: pages/data/history.json
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_DATE: ${{ steps.commit.outputs.date }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          COMMIT_AUTHOR: ${{ steps.commit.outputs.author }}
        run: |
          set -euo pipefail
          mkdir -p pages/data
          # Refresh static site files from trunk on every run, but never
          # clobber the accumulated history.json that lives only on gh-pages.
          rsync -a --exclude='data/history.json' .github/perf-site/ pages/
          touch pages/.nojekyll
          node tests/e2e/benchmark/append-history.mjs

      - name: Upload completed performance history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-history-data
          path: pages/data/history.json

  publish:
    name: Publish performance history
    needs: bench-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: perf-history-data
          path: ${{ runner.temp }}/perf-history-data

      - name: Publish completed performance history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/publish-performance-history.sh "$RUNNER_TEMP/perf-history-data/history.json"
